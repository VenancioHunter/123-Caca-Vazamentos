{% extends "layout.html" %} {% block title %}ADM Agenda{% endblock %} {% block
content %}
<div class="container">
  <div class="my-4" align="center">
    <h1>Agenda por Técnico</h1>
  </div>

  <!-- Filtros -->
  <div class="row g-2 mb-4 align-items-end">
    <div class="col-md-4">
      <label for="date" class="form-label">Data</label>
      <input type="date" id="date" class="form-control" />
    </div>
    <div class="col-md-4">
      <label for="filtro-tecnico" class="form-label">Técnico</label>
      <select id="filtro-tecnico" class="form-select" onchange="render()">
        <option value="">Todos os técnicos</option>
      </select>
    </div>
    <div class="col-md-4">
      <button id="fetch-data" class="btn btn-primary w-100" onclick="buscar()">
        Buscar
      </button>
    </div>
  </div>

  <div id="resumo-financeiro" class="mb-4"></div>

  <div id="results">
    <!-- Blocos por técnico serão inseridos aqui -->
  </div>
</div>

<!-- Overlay + Pop-up de carregamento -->
<div class="overlay" id="overlay"></div>
<div class="popup" id="popup" align="center">
  <div class="spinner-border" role="status">
    <span class="visually-hidden">Loading...</span>
  </div>
  <div><span>Aguarde...</span></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/luxon@3/build/global/luxon.min.js"></script>
<script>
  // ---- Estado ----
  let dadosAgenda = {}; // { nomeTecnico: [os, ...] }
  let dataSelecionada = "";

  const DIAS_SEMANA = [
    "Domingo",
    "Segunda-feira",
    "Terça-feira",
    "Quarta-feira",
    "Quinta-feira",
    "Sexta-feira",
    "Sábado",
  ];

  // ---- Utilitários ----
  function escapeHtml(v) {
    return String(v == null ? "" : v).replace(/[&<>"']/g, function (c) {
      return {
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#39;",
      }[c];
    });
  }

  function formatarData(dstr) {
    // "2026-07-21" -> "21/07 (Terça-feira)"
    if (!dstr) return "";
    const partes = String(dstr).split("-");
    if (partes.length < 3) return dstr;
    const ano = Number(partes[0]);
    const mes = Number(partes[1]);
    const dia = Number(partes[2]);
    const dt = new Date(ano, mes - 1, dia); // data local (sem fuso UTC)
    const dd = String(dia).padStart(2, "0");
    const mm = String(mes).padStart(2, "0");
    return `${dd}/${mm} (${DIAS_SEMANA[dt.getDay()]})`;
  }

  function formatarHora(datetimeStr) {
    // "2026-07-21 11:00" -> "11:00"
    if (!datetimeStr) return "--:--";
    const partes = String(datetimeStr).split(" ");
    return partes[1] || "--:--";
  }

  // ---- Montagem dos cards (mesmas informações de view_schedule_atendente) ----
  function cardOS(os) {
    const ender = os.address || {};
    const loc = ender.localizacao
      ? `<a href="${escapeHtml(ender.localizacao)}" target="_blank" rel="noopener">${escapeHtml(
          ender.localizacao,
        )}</a>`
      : "Não informada";

    return `
      <div class="card mb-3">
        <div class="card-body">
          <h5 class="card-title">${escapeHtml(os.city || "")}</h5>
          <div class="my-2" style="font-weight: bold; text-align: right">
            <div>Data: ${formatarData(os.data)}</div>
            <div>Início ${formatarHora(os.start_datetime)} horas</div>
            <div>Término ${formatarHora(os.end_datetime)} horas</div>
          </div>
          <ul class="list-group list-group-flush">
            <li class="list-group-item">Nome: ${escapeHtml(os.name || "Não informado")}</li>
            <li class="list-group-item">Telefone: ${escapeHtml(os.phone || "Não informado")}</li>
            <li class="list-group-item">Serviço: ${escapeHtml(os.service || "Não informado")}</li>
          </ul>
          <div class="p-3 my-3" style="background-color: rgb(219, 219, 219)">
            <label class="fw-bold">Endereço</label>
            <ul class="list-group list-group-flush">
              <li class="list-group-item">Bairro/Setor: ${escapeHtml(ender.bairro || "Não informado")}</li>
              <li class="list-group-item">Rua: ${escapeHtml(ender.rua || "Não informado")}</li>
              <li class="list-group-item">Nº: ${escapeHtml(ender.numero || "Não informado")}</li>
              <li class="list-group-item">Complemento: ${escapeHtml(ender.complemento || "Não informado")}</li>
              <li class="list-group-item">Localização: ${loc}</li>
            </ul>
          </div>
          <div style="text-align: right">
            <h5>Valor R$ <span>${escapeHtml(os.newprice || "0,00")}</span></h5>
          </div>
        </div>
      </div>`;
  }

  function blocoTecnico(nome, lista) {
    const cards = lista.map(cardOS).join("");
    return `
      <div class="mb-5">
        <div class="d-flex justify-content-between align-items-center flex-wrap gap-2 mb-3 pb-2 border-bottom">
          <h4 class="mb-0" style="color: #0d5590">
            ${escapeHtml(nome)}
            <span class="badge bg-secondary align-middle">${lista.length} OS</span>
          </h4>
          <button
            class="btn btn-outline-primary btn-sm"
            data-print-tecnico="${escapeHtml(nome)}"
          >
            🖨️ Imprimir OSs
          </button>
        </div>
        ${cards}
      </div>`;
  }

  // ---- Render ----
  function render() {
    const filtro = document.getElementById("filtro-tecnico").value;
    const container = document.getElementById("results");
    const nomes = Object.keys(dadosAgenda);
    const alvo = filtro ? nomes.filter((n) => n === filtro) : nomes;

    if (!alvo.length) {
      document.getElementById("resumo-financeiro").innerHTML = "";
      container.innerHTML =
        '<p class="text-muted text-center">Nenhum agendamento encontrado.</p>';
      return;
    }

    renderResumo(alvo);

    container.innerHTML = alvo
      .sort()
      .map((n) => blocoTecnico(n, dadosAgenda[n]))
      .join("");
  }

  // Resumo financeiro dos técnicos exibidos (reflete o filtro atual)
  function renderResumo(nomes) {
    let geral = 0,
      recebido = 0,
      pendente = 0,
      aguardando = 0;

    nomes.forEach((n) => {
      (dadosAgenda[n] || []).forEach((os) => {
        const v = parseValor(os.newprice);
        geral += v;
        const st = String(os.status_paymment || "").toLowerCase();
        if (st === "recebido") recebido += v;
        else if (st === "pendente") pendente += v;
        else aguardando += v;
      });
    });

    document.getElementById("resumo-financeiro").innerHTML = `
      <div class="card p-3">
        <h5 class="mb-3">Resumo Financeiro</h5>
        <ul class="list-group list-group-flush">
          <li class="list-group-item d-flex justify-content-between">
            <span>Total Geral</span><strong>${moedaBRL(geral)}</strong>
          </li>
          <li class="list-group-item d-flex justify-content-between">
            <span>Recebido</span><strong class="text-success">${moedaBRL(recebido)}</strong>
          </li>
          <li class="list-group-item d-flex justify-content-between">
            <span>Pendente</span><strong class="text-primary">${moedaBRL(pendente)}</strong>
          </li>
          <li class="list-group-item d-flex justify-content-between">
            <span>Aguardando</span><strong class="text-warning">${moedaBRL(aguardando)}</strong>
          </li>
        </ul>
      </div>`;
  }

  function popularTecnicos() {
    const sel = document.getElementById("filtro-tecnico");
    const anterior = sel.value;
    const nomes = Object.keys(dadosAgenda).sort();
    sel.innerHTML =
      '<option value="">Todos os técnicos</option>' +
      nomes
        .map((n) => `<option value="${escapeHtml(n)}">${escapeHtml(n)}</option>`)
        .join("");
    // Mantém a seleção anterior se o técnico ainda existir
    if (anterior && nomes.includes(anterior)) {
      sel.value = anterior;
    }
  }

  // ---- Busca ----
  function buscar() {
    const date = document.getElementById("date").value;
    if (!date) {
      alert("Selecione uma data.");
      return;
    }
    dataSelecionada = date;
    mostrarPopup();

    fetch(`/get_technician_schedules?date=${date}`)
      .then((response) => {
        if (!response.ok) throw new Error("Erro ao buscar os agendamentos.");
        return response.json();
      })
      .then((data) => {
        dadosAgenda = data && !data.error ? data : {};
        popularTecnicos();
        render();
        fecharPopup();
      })
      .catch((error) => {
        fecharPopup();
        console.error("Erro ao buscar os agendamentos:", error);
        alert("Erro ao buscar os agendamentos.");
      });
  }

  // ---- Helpers de impressão ----
  const MESES = [
    "janeiro", "fevereiro", "março", "abril", "maio", "junho",
    "julho", "agosto", "setembro", "outubro", "novembro", "dezembro",
  ];

  function parseValor(v) {
    if (v == null) return 0;
    let s = String(v).trim();
    if (s.indexOf(",") > -1) s = s.replace(/\./g, "").replace(",", ".");
    return parseFloat(s) || 0;
  }

  function moedaBRL(num) {
    return (
      "R$ " +
      Number(num || 0).toLocaleString("pt-BR", {
        minimumFractionDigits: 2,
        maximumFractionDigits: 2,
      })
    );
  }

  function dataExtenso(dstr) {
    const p = String(dstr || "").split("-").map(Number);
    if (p.length < 3) return dstr || "";
    return `${p[2]} de ${MESES[p[1] - 1]} de ${p[0]}`;
  }

  function diaSemanaDe(dstr) {
    const p = String(dstr || "").split("-").map(Number);
    if (p.length < 3) return "";
    return DIAS_SEMANA[new Date(p[0], p[1] - 1, p[2]).getDay()];
  }

  function horaDe(dt) {
    return String(dt || "").split(" ")[1] || "--:--";
  }

  function enderecoLinha(e) {
    e = e || {};
    const rua = (e.rua || "").trim();
    const num = (e.numero || "").trim();
    if (!rua && !num) return "Não informado";
    if (rua && num) return `${rua}, Nº ${num}`;
    return rua || `Nº ${num}`;
  }

  // ---- Impressão por técnico (modelo profissional "Agenda do Dia") ----
  function imprimirTecnico(nome) {
    const lista = dadosAgenda[nome] || [];
    if (!lista.length) return;

    // Agregados do cabeçalho
    const qtd = lista.length;
    const totalValor = lista.reduce((s, o) => s + parseValor(o.newprice), 0);
    const inicios = lista.map((o) => horaDe(o.start_datetime)).filter((h) => h !== "--:--").sort();
    const fins = lista.map((o) => horaDe(o.end_datetime)).filter((h) => h !== "--:--").sort();
    const periodo = `${inicios[0] || "--:--"} – ${fins[fins.length - 1] || "--:--"}`;
    const cidades = [...new Set(lista.map((o) => o.city).filter(Boolean))].join(" · ");
    const qtdLabel =
      String(qtd).padStart(2, "0") +
      " " +
      (qtd === 1 ? "ordem de serviço" : "ordens de serviço");
    const logoUrl = `${window.location.origin}/static/img/logo.png`;

    // Cards de OS
    const cards = lista
      .map((os, i) => {
        const e = os.address || {};
        return `
        <article class="os">
          <div class="os-side">
            <span class="os-tag">OS</span>
            <span class="os-num">${String(i + 1).padStart(2, "0")}</span>
          </div>
          <div class="os-body">
            <div class="os-top">
              <div class="os-top-left">
                <h2 class="os-city">${escapeHtml(os.city || "")}</h2>
                ${os.service ? `<span class="badge">${escapeHtml(os.service)}</span>` : ""}
              </div>
              <div class="os-top-boxes">
                <div class="mini">
                  <div class="mini-label">HORÁRIO</div>
                  <div class="mini-val">${horaDe(os.start_datetime)} – ${horaDe(os.end_datetime)}</div>
                </div>
                <div class="mini mini-hl">
                  <div class="mini-label">VALOR</div>
                  <div class="mini-val">${moedaBRL(parseValor(os.newprice))}</div>
                </div>
              </div>
            </div>
            <div class="grid">
              <div class="field"><div class="f-label">CLIENTE</div><div class="f-val">${escapeHtml(os.name || "Não informado")}</div></div>
              <div class="field"><div class="f-label">TELEFONE</div><div class="f-val">${escapeHtml(os.phone || "Não informado")}</div></div>
              <div class="field"><div class="f-label">BAIRRO / SETOR</div><div class="f-val">${escapeHtml(e.bairro || "Não informado")}</div></div>
              <div class="field"><div class="f-label">COMPLEMENTO</div><div class="f-val">${escapeHtml(e.complemento || "Não informado")}</div></div>
              <div class="field field-full"><div class="f-label">ENDEREÇO</div><div class="f-val">${escapeHtml(enderecoLinha(e))}</div></div>
            </div>
            <div class="obs">
              <div class="f-label">OBSERVAÇÕES</div>
              <div class="obs-area"></div>
            </div>
          </div>
        </article>`;
      })
      .join("");

    const css = `
      *{box-sizing:border-box;margin:0;padding:0;}
      :root{--navy:#1c2b57;--deep:#16244d;--muted:#97a0b3;--ink:#2c3444;--line:#e6e9f1;--soft:#f2f4f9;--badge:#eaeef6;}
      html,body{font-family:'Inter',-apple-system,'Segoe UI',Roboto,Arial,sans-serif;color:var(--ink);font-size:12.5px;-webkit-print-color-adjust:exact;print-color-adjust:exact;}
      .doc{max-width:780px;margin:0 auto;padding:26px 30px;}
      .kicker{font-size:9px;letter-spacing:2.5px;color:var(--muted);font-weight:600;text-transform:uppercase;}
      .doc-head{display:flex;justify-content:space-between;align-items:center;}
      .brand{display:flex;align-items:center;gap:12px;}
      .brand .logo{width:44px;height:44px;object-fit:contain;}
      .brand-name{font-family:'Poppins',sans-serif;font-weight:700;font-size:17px;color:var(--navy);letter-spacing:.5px;}
      .brand-sub{font-size:8.5px;letter-spacing:2px;color:var(--muted);font-weight:600;margin-top:2px;}
      .head-right{text-align:right;}
      .head-date{font-family:'Poppins',sans-serif;font-weight:700;font-size:15px;color:var(--navy);margin-top:3px;}
      .rule{height:2px;background:var(--navy);margin:14px 0 18px;border-radius:2px;}
      .tech{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:16px;}
      .tech-name{font-family:'Poppins',sans-serif;font-size:32px;color:var(--navy);font-weight:700;line-height:1;margin-top:5px;}
      .tech-right{text-align:right;}
      .weekday{color:var(--muted);font-size:12px;}
      .tech-count{font-weight:700;color:var(--navy);font-size:13px;margin-top:2px;}
      .stats{display:flex;gap:12px;margin-bottom:22px;}
      .stat{flex:1;background:var(--soft);border:1px solid var(--line);border-radius:12px;padding:12px 14px;}
      .stat-label{font-size:8.5px;letter-spacing:1.8px;color:var(--muted);font-weight:600;text-transform:uppercase;margin-bottom:6px;}
      .stat-val{font-family:'Poppins',sans-serif;font-weight:700;font-size:18px;color:var(--navy);}
      .stat-val.small{font-size:12.5px;}
      .stat-hl{background:var(--deep);border-color:var(--deep);}
      .stat-hl .stat-label{color:#9fb0d6;}
      .stat-hl .stat-val{color:#fff;}
      .section-title{display:flex;align-items:center;gap:14px;margin-bottom:14px;}
      .section-title span{font-weight:700;color:var(--navy);font-size:13px;letter-spacing:1px;text-transform:uppercase;white-space:nowrap;}
      .section-title i{flex:1;height:1px;background:var(--line);}
      .os{display:flex;border:1px solid var(--line);border-radius:14px;overflow:hidden;margin-bottom:16px;break-inside:avoid;page-break-inside:avoid;}
      .os-side{width:66px;background:var(--deep);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;}
      .os-tag{font-size:9px;letter-spacing:2px;color:#9fb0d6;font-weight:600;}
      .os-num{font-family:'Poppins',sans-serif;font-weight:700;font-size:26px;line-height:1;}
      .os-body{flex:1;padding:16px 18px;}
      .os-top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:14px;}
      .os-city{font-family:'Poppins',sans-serif;font-size:20px;color:var(--navy);font-weight:700;line-height:1.1;}
      .badge{display:inline-block;margin-top:6px;background:var(--badge);color:var(--navy);font-size:10px;font-weight:600;padding:4px 11px;border-radius:999px;}
      .os-top-boxes{display:flex;gap:10px;}
      .mini{background:var(--soft);border:1px solid var(--line);border-radius:10px;padding:8px 14px;text-align:center;min-width:96px;}
      .mini-label{font-size:8px;letter-spacing:1.5px;color:var(--muted);font-weight:600;margin-bottom:3px;}
      .mini-val{font-family:'Poppins',sans-serif;font-weight:700;font-size:13px;color:var(--navy);white-space:nowrap;}
      .mini-hl{background:#eef1f8;}
      .grid{display:grid;grid-template-columns:1fr 1fr;gap:12px 20px;}
      .field-full{grid-column:1 / -1;}
      .f-label{font-size:8.5px;letter-spacing:1.5px;color:var(--muted);font-weight:600;text-transform:uppercase;margin-bottom:2px;}
      .f-val{font-size:13px;color:var(--ink);}
      .obs{margin-top:14px;}
      .obs-area{border:1px solid var(--line);border-radius:10px;height:50px;margin-top:5px;}
      .doc-foot{display:flex;justify-content:space-between;align-items:flex-end;margin-top:26px;padding-top:14px;border-top:1px solid var(--line);}
      .foot-left{font-size:10px;color:var(--muted);line-height:1.6;}
      .foot-right{display:flex;gap:28px;}
      .sign{text-align:center;}
      .sign-line{width:170px;border-top:1px solid #b9c0cf;margin-bottom:5px;}
      .sign-label{font-size:9px;letter-spacing:1.5px;color:var(--muted);font-weight:600;}
      @page{size:A4;margin:12mm;}
      @media print{.doc{padding:0;max-width:none;}}
    `;

    const html = `<!doctype html>
      <html lang="pt-br">
        <head>
          <meta charset="utf-8" />
          <title>Agenda - ${escapeHtml(nome)} - ${dataExtenso(dataSelecionada)}</title>
          <link rel="preconnect" href="https://fonts.googleapis.com" />
          <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
          <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@600;700&display=swap" rel="stylesheet" />
          <style>${css}</style>
        </head>
        <body>
          <div class="doc">
            <header class="doc-head">
              <div class="brand">
                <img class="logo" src="${logoUrl}" alt="" onerror="this.style.display='none'" />
                <div>
                  <div class="brand-name">123 CAÇA VAZAMENTOS</div>
                  <div class="brand-sub">DETECÇÃO E REPARO DE VAZAMENTOS</div>
                </div>
              </div>
              <div class="head-right">
                <div class="kicker">AGENDA DO DIA</div>
                <div class="head-date">${dataExtenso(dataSelecionada)}</div>
              </div>
            </header>
            <div class="rule"></div>

            <section class="tech">
              <div>
                <div class="kicker">TÉCNICO RESPONSÁVEL</div>
                <div class="tech-name">${escapeHtml(nome)}</div>
              </div>
              <div class="tech-right">
                <div class="weekday">${diaSemanaDe(dataSelecionada)}</div>
                <div class="tech-count">${qtdLabel}</div>
              </div>
            </section>

            <section class="stats">
              <div class="stat">
                <div class="stat-label">Total de OS</div>
                <div class="stat-val">${String(qtd).padStart(2, "0")}</div>
              </div>
              <div class="stat stat-hl">
                <div class="stat-label">Valor previsto</div>
                <div class="stat-val">${moedaBRL(totalValor)}</div>
              </div>
              <div class="stat">
                <div class="stat-label">Período</div>
                <div class="stat-val">${periodo}</div>
              </div>
              <div class="stat">
                <div class="stat-label">Cidades</div>
                <div class="stat-val small">${escapeHtml(cidades || "—")}</div>
              </div>
            </section>

            <div class="section-title"><span>Ordens de Serviço</span><i></i></div>

            ${cards}

            <footer class="doc-foot">
              <div class="foot-left">
                Documento gerado automaticamente pelo sistema<br />
                123 Caça Vazamentos · ${dataExtenso(dataSelecionada)}
              </div>
              <div class="foot-right">
                <div class="sign"><div class="sign-line"></div><div class="sign-label">ASSINATURA DO TÉCNICO</div></div>
                <div class="sign"><div class="sign-line"></div><div class="sign-label">CONFERÊNCIA</div></div>
              </div>
            </footer>
          </div>
          <script>
            window.onload = function () {
              var go = function () { setTimeout(function () { window.print(); }, 200); };
              if (document.fonts && document.fonts.ready) {
                document.fonts.ready.then(go);
              } else {
                go();
              }
            };
          <\/script>
        </body>
      </html>`;

    const win = window.open("", "_blank");
    win.document.write(html);
    win.document.close();
  }

  // Delegação do clique de imprimir (evita problemas de escape em nomes)
  document.addEventListener("click", function (event) {
    const botao = event.target.closest("[data-print-tecnico]");
    if (botao) {
      imprimirTecnico(botao.getAttribute("data-print-tecnico"));
    }
  });

  // ---- Overlay/Pop-up ----
  function mostrarPopup() {
    document.getElementById("overlay").style.display = "block";
    document.getElementById("popup").style.display = "block";
  }

  function fecharPopup() {
    document.getElementById("overlay").style.display = "none";
    document.getElementById("popup").style.display = "none";
  }

  // ---- Data inicial = hoje (São Paulo) ----
  document.addEventListener("DOMContentLoaded", function () {
    const nowInSaoPaulo = luxon.DateTime.now().setZone("America/Sao_Paulo");
    document.getElementById("date").value = nowInSaoPaulo.toFormat("yyyy-MM-dd");
  });
