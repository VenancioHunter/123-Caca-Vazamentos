{% extends "layout.html" %} {% block title %}Gerar Ordem de Serviço{% endblock %}
{% block content %}
<script src="{{ url_for('static', filename='js/formatarValor.js') }}"></script>

<div class="container" style="max-width: 720px">
  <h3 class="fw-bold mb-4" style="color: #0d5590">Gerar Ordem de Serviço</h3>

  <form id="osForm" method="post" action="/gerar_os" class="card border-0 shadow-sm">
    <div class="card-body">
      <!-- Vínculo com o atendimento -->
      <input id="osIdRecord" name="idRecord" value="{{ attendance_id }}" hidden />
      <input id="buscaDateHidden" name="date" value="{{ date }}" hidden />

      <div class="mb-3">
        <label for="osCity" class="form-label">Cidade</label>
        <input type="text" class="form-control" id="osCity" name="city"
               value="{{ city }}" readonly />
      </div>

      <div class="mb-3">
        <label for="osName" class="form-label">Cliente</label>
        <input type="text" class="form-control" id="osName" name="name"
               value="{{ attendance.name|default('', true) }}"
               oninput="capitalizarNome(this)" />
      </div>

      <div class="mb-3">
        <label for="osCPFCNPJ" class="form-label">CPF/CNPJ</label>
        <input type="text" class="form-control" id="osCPFCNPJ" name="cpfcnpj"
               oninput="formatarCpfCnpj(this)" />
      </div>

      <div class="mb-3">
        <label for="osPhone" class="form-label">Telefone</label>
        <input type="text" class="form-control" id="osPhone" name="phone"
               value="{{ attendance.phone|default('', true) }}" readonly />
      </div>

      <div class="mb-3">
        <label for="osServico" class="form-label">Serviço</label>
        <input type="text" class="form-control" id="osServico" name="service"
               value="{{ attendance.service|default('', true) }}" />
      </div>

      <div class="mb-3">
        <label for="osPrice" class="form-label">Valor</label>
        <input type="text" class="form-control" id="osPrice" name="price"
               value="{{ attendance.price|default('', true) }}" readonly />
      </div>

      <div class="mb-3">
        <label for="osPriceFinal" class="form-label">Valor Final</label>
        <input type="text" class="form-control" id="osPriceFinal"
               name="priceservice" required />
      </div>

      <div class="p-3 my-3 rounded" style="background-color: #f2f4f9">
        <h5 class="mb-3">Endereço</h5>
        <div class="mb-3">
          <label for="osBairro" class="form-label">Bairro/Setor</label>
          <input type="text" class="form-control" id="osBairro" name="bairro" />
        </div>
        <div class="mb-3">
          <label for="osRua" class="form-label">Rua</label>
          <input type="text" class="form-control" id="osRua" name="rua" />
        </div>
        <div class="mb-3">
          <label for="osNumeroCasa" class="form-label">Nº</label>
          <input type="text" class="form-control" id="osNumeroCasa" name="numerocasa" />
        </div>
        <div class="mb-3">
          <label for="osEnderecoComplemento" class="form-label">Complemento</label>
          <input type="text" class="form-control" id="osEnderecoComplemento"
                 name="enderecocomplemento" />
        </div>
        <div class="mb-3">
          <label for="osLocalizacao" class="form-label">Localização</label>
          <input type="text" class="form-control" id="osLocalizacao" name="localizacao" />
        </div>
      </div>

      <div class="mb-3">
        <label for="osDate" class="form-label">Data</label>
        <input type="date" class="form-control" id="osDate" name="dateos" required />
      </div>

      <div class="mb-3">
        <label for="osStartTime" class="form-label">Hora de Início</label>
        <input type="time" class="form-control" id="osStartTime" name="start_time" required />
      </div>

      <div class="mb-3">
        <label for="osEndTime" class="form-label">Hora de Término</label>
        <input type="time" class="form-control" id="osEndTime" name="end_time" required />
      </div>

      <div class="mb-3">
        <label for="osTechnician" class="form-label">Técnico</label>
        <select class="form-select" id="osTechnician" name="tecnico">
          <option selected value="">Selecionar Técnico</option>
          {% for tecnico_id, tecnico in tecnicos.items() %}
          <option value="{{ tecnico_id }}">{{ tecnico.name }}</option>
          {% endfor %}
        </select>
      </div>

      <div class="d-flex gap-2">
        <a href="{{ url_for('dashboard') }}" class="btn btn-outline-secondary">
          Cancelar
        </a>
        <button type="submit" id="confirmaros" class="btn btn-primary flex-fill" disabled>
          Confirmar OS
        </button>
      </div>
    </div>
  </form>
</div>

<script>
  function capitalizarNome(input) {
    input.value = input.value
      .toLowerCase()
      .split(" ")
      .map((p) => (p ? p[0].toUpperCase() + p.slice(1) : p))
      .join(" ");
  }

  function formatarCpfCnpj(input) {
    let v = input.value.replace(/\D/g, "");
    if (v.length <= 11) {
      v = v.replace(/(\d{3})(\d)/, "$1.$2");
      v = v.replace(/(\d{3})(\d)/, "$1.$2");
      v = v.replace(/(\d{3})(\d{1,2})$/, "$1-$2");
    } else {
      v = v.replace(/^(\d{2})(\d)/, "$1.$2");
      v = v.replace(/^(\d{2})\.(\d{3})(\d)/, "$1.$2.$3");
      v = v.replace(/\.(\d{3})(\d)/, ".$1/$2");
      v = v.replace(/(\d{4})(\d{1,2})$/, "$1-$2");
    }
    input.value = v;
  }
</script>

<!-- Verificação de conflito de agenda + habilitação do botão -->
<script>
  function verificarAgenda() {
    const date = document.getElementById("osDate").value;
    const startTime = document.getElementById("osStartTime").value;
    const endTime = document.getElementById("osEndTime").value;
    const technician = document.getElementById("osTechnician").value;
    const city = document.getElementById("osCity").value;
    const botao = document.getElementById("confirmaros");

    // Sem técnico escolhido, botão fica desabilitado
    if (!technician) {
      botao.disabled = true;
      return;
    }
    // Só verifica agenda quando data/horários estão preenchidos
    if (!date || !startTime || !endTime) {
      botao.disabled = false;
      return;
    }

    fetch("/verifica_agenda", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ date, startTime, endTime, technician, city }),
    })
      .then((response) => {
        if (response.ok) {
          botao.disabled = false;
          return response.json();
        }
        return response.json().then((err) => {
          throw new Error(err.message);
        });
      })
      .catch((error) => {
        botao.disabled = true;
        alert(error.message);
      });
  }

  document.addEventListener("DOMContentLoaded", function () {
    ["osTechnician", "osDate", "osStartTime", "osEndTime"].forEach((id) => {
      const el = document.getElementById(id);
      if (el) el.addEventListener("change", verificarAgenda);
    });
    if (typeof configurarFormatacaoValor === "function") {
      configurarFormatacaoValor("osPriceFinal");
    }
  });
</script>

<!-- Data da OS = hoje (São Paulo) por padrão -->
<script src="https://cdn.jsdelivr.net/npm/luxon@3/build/global/luxon.min.js"></script>
<script>
  document.addEventListener("DOMContentLoaded", function () {
    const hoje = luxon.DateTime.now()
      .setZone("America/Sao_Paulo")
      .toFormat("yyyy-MM-dd");
    const dateInput = document.getElementById("osDate");
    if (dateInput && !dateInput.value) dateInput.value = hoje;
  });
</script>
{% endblock %}
